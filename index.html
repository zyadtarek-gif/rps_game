<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حجر ورقة مقص بالكاميرا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered column, camera stage on top, controls and score below. */
  :root {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --fg: #14202e;
    --muted: #5b6b7d;
    --line: #d5dce4;
    --accent: #0a7d5a;
    --accent-fg: #ffffff;
    --win: #0a7d5a;
    --lose: #c0392b;
    --draw: #9a6b00;
    --font: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1722; --surface: #172233; --fg: #e8eef5; --muted: #93a3b5;
      --line: #263449; --accent: #2fd1a0; --accent-fg: #06261d;
      --win: #2fd1a0; --lose: #ff6b5b; --draw: #f0b429;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1722; --surface: #172233; --fg: #e8eef5; --muted: #93a3b5;
    --line: #263449; --accent: #2fd1a0; --accent-fg: #06261d;
    --win: #2fd1a0; --lose: #ff6b5b; --draw: #f0b429;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 20px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 1.6rem; font-weight: 900; text-wrap: balance; }
  .sub { margin: 0; color: var(--muted); }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .mirror { position: absolute; inset: 0; transform: scaleX(-1); }
  .mirror video, .mirror canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .placeholder {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #cfd8e3; text-align: center; padding: 16px; font-weight: 500;
  }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
  .count { font-size: clamp(5rem, 28vw, 9rem); font-weight: 900; color: #ffd54a; text-shadow: 0 4px 16px rgba(0,0,0,.7); }
  .result { padding: 16px; text-shadow: 0 2px 10px rgba(0,0,0,.8); color: #fff; }
  .result .moves { font-size: clamp(1.2rem, 5vw, 1.8rem); font-weight: 700; }
  .result .verdict { font-size: clamp(2rem, 9vw, 3.2rem); font-weight: 900; }
  .verdict.win { color: #4df0b8; } .verdict.lose { color: #ff7d6e; } .verdict.draw { color: #ffd54a; }

  .live {
    position: absolute; inset-inline-start: 10px; bottom: 10px;
    background: rgba(0,0,0,.6); color: #fff; padding: 4px 12px; border-radius: 999px; font-weight: 700;
  }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg);
    padding: 12px 18px; min-height: 48px;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; flex: 1 1 180px; font-size: 1.1rem; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .score div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .score b { display: block; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
  .score span { color: var(--muted); font-size: .9rem; }

  .guide { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  .guide ul { margin: 6px 0 0; padding-inline-start: 20px; }
  .msg { color: var(--lose); font-weight: 700; min-height: 1.5em; margin: 0; }
  @media (prefers-reduced-motion: no-preference) { .count { animation: pop .5s ease-out; } }
  @keyframes pop { from { transform: scale(1.4); opacity: .3; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>حجر ورقة مقص بالكاميرا</h1>
    <p class="sub">وجّه إيدك للكاميرا والكمبيوتر هيقرأ حركتك.</p>
  </header>

  <section class="stage" aria-label="الكاميرا">
    <div class="mirror" id="mirror">
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>
    <div class="placeholder" id="placeholder">بنطلب إذن الكاميرا... لما المتصفح يسألك اضغط «سماح»</div>
    <div class="overlay" id="overlay" aria-live="polite"></div>
    <div class="live" id="live" hidden></div>
  </section>

  <p class="msg" id="msg" role="status"></p>

  <div class="actions">
    <button class="primary" id="startBtn">شغّل الكاميرا</button>
    <button class="primary" id="playBtn" disabled>ابدأ الجولة</button>
    <button id="resetBtn">صفّر النتيجة</button>
  </div>

  <section class="score" aria-label="النتيجة">
    <div><b id="sYou">0</b><span>أنت</span></div>
    <div><b id="sDraw">0</b><span>تعادل</span></div>
    <div><b id="sCpu">0</b><span>الكمبيوتر</span></div>
  </section>

  <section class="guide">
    <strong>الإشارات</strong>
    <ul>
      <li>قبضة مقفولة = حجر</li>
      <li>أربع صوابع مفتوحة = ورقة</li>
      <li>السبابة والوسطى = مقص</li>
    </ul>
    <p class="sub">الأفضل: إضاءة كويسة، وكف إيدك مواجه للكاميرا.</p>
  </section>
</main>

<script type="module">
const MP_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm";
window.addEventListener("error", (e) => {
  const m = document.getElementById("msg");
  if (m) m.textContent = "حصل خطأ في الصفحة: " + e.message;
});

const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm";
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

const COUNTDOWN_MS = 3000;
const SAMPLE_MS = 600;
const RESULT_MS = 3000;

const MOVES = ["rock", "paper", "scissors"];
const LABEL = { rock: "حجر", paper: "ورقة", scissors: "مقص" };
const ICON = { rock: "✊", paper: "✋", scissors: "✌️" };
const BEATS = { rock: "scissors", paper: "rock", scissors: "paper" };

const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]
];
const TIPS = [8, 12, 16, 20];
const PIPS = [6, 10, 14, 18];

const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const startBtn = $("startBtn"), playBtn = $("playBtn"), resetBtn = $("resetBtn");
const overlay = $("overlay"), live = $("live"), msg = $("msg"), placeholder = $("placeholder");

let landmarker = null;
let state = "idle";            // idle | countdown | result
let stateStart = 0;
let samples = [];
let lastVideoTime = -1;
let score = { you: 0, draw: 0, cpu: 0 };

function classify(lm) {
  const w = video.videoWidth || 1, h = video.videoHeight || 1;
  const d = (a, b) => Math.hypot((a.x - b.x) * w, (a.y - b.y) * h);
  const wrist = lm[0];
  const up = TIPS.map((tip, i) => d(wrist, lm[tip]) > d(wrist, lm[PIPS[i]]) * 1.1);
  const [index, middle, ring, pinky] = up;
  if (!up.some(Boolean)) return "rock";
  if (up.every(Boolean)) return "paper";
  if (index && middle && !ring && !pinky) return "scissors";
  return null;
}

function decide(player, cpu) {
  if (player === cpu) return "draw";
  return BEATS[player] === cpu ? "win" : "lose";
}

function mostCommon(arr) {
  const counts = {};
  for (const x of arr) counts[x] = (counts[x] || 0) + 1;
  return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
}

function showScore() {
  $("sYou").textContent = score.you;
  $("sDraw").textContent = score.draw;
  $("sCpu").textContent = score.cpu;
}

function drawHand(lm) {
  const w = canvas.width, h = canvas.height;
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#35e0a1";
  ctx.beginPath();
  for (const [a, b] of CONNECTIONS) {
    ctx.moveTo(lm[a].x * w, lm[a].y * h);
    ctx.lineTo(lm[b].x * w, lm[b].y * h);
  }
  ctx.stroke();
  ctx.fillStyle = "#ff5a4d";
  for (const p of lm) {
    ctx.beginPath();
    ctx.arc(p.x * w, p.y * h, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

async function createLandmarker() {
  const { HandLandmarker, FilesetResolver } = await import(MP_URL);
  const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
  const make = (delegate) => HandLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODEL_URL, delegate },
    runningMode: "VIDEO",
    numHands: 1,
    minHandDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6
  });
  try { return await make("GPU"); } catch { return await make("CPU"); }
}

async function startCamera() {
  msg.textContent = "";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    placeholder.textContent = "الكاميرا مش متاحة في الصفحة دي";
    msg.textContent = "المتصفح مش بيسمح بالكاميرا هنا. افتح الصفحة من رابط https في كروم أو سفاري (مش من ملف على الجهاز، ومش من جوه واتساب أو فيسبوك).";
    return;
  }
  startBtn.disabled = true;
  placeholder.textContent = "لو المتصفح سألك عن الكاميرا اضغط «سماح»...";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    placeholder.textContent = "الكاميرا اشتغلت، بنحمّل موديل اليد...";
    try {
      landmarker = await createLandmarker();
    } catch (e) {
      console.error(e);
      placeholder.hidden = true;
      startBtn.disabled = false;
      startBtn.textContent = "حاول تاني";
      msg.textContent = "الكاميرا اشتغلت بس مقدرناش نحمّل موديل اليد. اتأكد من الإنترنت وحاول تاني.";
      return;
    }
    placeholder.hidden = true;
    live.hidden = false;
    live.textContent = "الإشارة: -";
    playBtn.disabled = false;
    startBtn.hidden = true;
    requestAnimationFrame(loop);
  } catch (err) {
    startBtn.disabled = false;
    startBtn.textContent = "اطلب إذن الكاميرا تاني";
    placeholder.textContent = "محتاجين إذن الكاميرا عشان اللعبة تشتغل";
    msg.textContent = err && err.name === "NotAllowedError"
      ? "الإذن بالكاميرا مرفوض. اضغط على أيقونة القفل جنب الرابط، اختار الكاميرا وخليها «سماح»، وبعدين اضغط الزرار تاني."
      : "مقدرناش نشغّل الكاميرا أو نحمّل الموديل. اتأكد من الإنترنت وإن مفيش برنامج تاني شاغل الكاميرا.";
    console.error(err);
  }
}

function startRound() {
  if (state === "countdown") return;
  state = "countdown";
  stateStart = performance.now();
  samples = [];
  playBtn.disabled = true;
}

function finishRound(now) {
  const valid = samples.filter(Boolean);
  if (valid.length) {
    const player = mostCommon(valid);
    const cpu = MOVES[Math.floor(Math.random() * 3)];
    const outcome = decide(player, cpu);
    if (outcome === "win") score.you++;
    else if (outcome === "lose") score.cpu++;
    else score.draw++;
    showScore();
    const text = { win: "فزت!", lose: "الكمبيوتر فاز", draw: "تعادل" }[outcome];
    overlay.innerHTML =
      `<div class="result"><div class="moves">أنت ${ICON[player]} ${LABEL[player]} — الكمبيوتر ${ICON[cpu]} ${LABEL[cpu]}</div>` +
      `<div class="verdict ${outcome}">${text}</div></div>`;
  } else {
    overlay.innerHTML = `<div class="result"><div class="verdict draw">مفيش إشارة واضحة، جرّب تاني</div></div>`;
  }
  state = "result";
  stateStart = now;
}

function loop() {
  const now = performance.now();
  let gesture = null;

  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, now);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (res.landmarks && res.landmarks.length) {
      const lm = res.landmarks[0];
      drawHand(lm);
      gesture = classify(lm);
    }
    live.textContent = "الإشارة: " + (gesture ? `${ICON[gesture]} ${LABEL[gesture]}` : "-");
  }

  if (state === "countdown") {
    const elapsed = now - stateStart;
    if (gesture !== undefined && elapsed >= COUNTDOWN_MS - SAMPLE_MS) samples.push(gesture);
    if (elapsed >= COUNTDOWN_MS) {
      finishRound(now);
    } else {
      const remaining = Math.ceil((COUNTDOWN_MS - elapsed) / 1000);
      if (overlay.dataset.n !== String(remaining)) {
        overlay.dataset.n = String(remaining);
        overlay.innerHTML = `<div class="count">${remaining}</div>`;
      }
    }
  } else if (state === "result" && now - stateStart >= RESULT_MS) {
    state = "idle";
    overlay.innerHTML = "";
    overlay.dataset.n = "";
    playBtn.disabled = false;
  }

  requestAnimationFrame(loop);
}

startBtn.addEventListener("click", startCamera);
playBtn.addEventListener("click", startRound);
resetBtn.addEventListener("click", () => { score = { you: 0, draw: 0, cpu: 0 }; showScore(); });
showScore();
startCamera();   // asks for camera permission as soon as the page opens
</script>
</body>
</html>
